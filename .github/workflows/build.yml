
name: Build BRAWL BOOST APK

on:
  workflow_dispatch:
  push:
    paths:
      - '**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip -q BRAWL-BOOST-REBUILT.zip -d extracted

      - name: Fix MainActivity
        run: |
          sed -i 's/setBackgroundColor(background)/setBackgroundColor(this@MainActivity.background)/' extracted/BrawlBoost/app/src/main/java/com/example/brawlboost/MainActivity.kt

      - name: Build APK
        working-directory: extracted/BrawlBoost
        run: gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BrawlBoost-APK
          path: extracted/BrawlBoost/app/build/outputs/apk/debug/*.apk

